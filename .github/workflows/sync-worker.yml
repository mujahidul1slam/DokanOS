## WooCommerce push worker — external scheduler
##
## WHY THIS EXISTS
## The Supabase pg_cron scheduler stopped executing jobs on 2026-07-29.
## sync-worker drains the sync_queue table (push_order rows) and invokes
## woo-push for each, updating WooCommerce order statuses. Without this
## workflow, newly-enqueued pushes sit indefinitely.
##
## AUTH
## sync-worker accepts: service-role bearer, a valid authenticated user JWT
## (frontend kickSyncWorker), or x-cron-secret matching the vault token
## `sync_worker_cron_token`. This workflow uses the anon key (valid project
## JWT for the gateway) + the SYNC_WORKER_CRON_TOKEN repo secret. Set the
## secret via: `Write-Output '<token>' | gh secret set SYNC_WORKER_CRON_TOKEN`.
##
## CAVEATS
## - sync-worker full-drains up to 1000 rows per invocation (BATCH 50 x 20).
## - GitHub disables scheduled workflows after ~60 days of repo inactivity.
## - Once the Cloudflare Worker cron is deployed as the primary scheduler,
##   demote this workflow to a once-daily dead-man's-switch (alert if the
##   queue's newest updated_at is stale).

name: Sync queue worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run sync-worker
        env:
          FN_URL: https://jiwndicvfkiltgageqwv.supabase.co/functions/v1/sync-worker
          CRON_TOKEN: ${{ secrets.SYNC_WORKER_CRON_TOKEN }}
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imppd25kaWN2ZmtpbHRnYWdlcXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjg5OTcsImV4cCI6MjEwMDkwNDk5N30.zWbTtxLYD1hw-vQ7qZdxm1NgUSWYHsS-0wWXg89_7MY
        run: |
          set -euo pipefail

          if [ -z "$CRON_TOKEN" ]; then
            echo "::error::SYNC_WORKER_CRON_TOKEN secret is not set. Add it in repository settings."
            exit 1
          fi

          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 300 \
            -X POST "$FN_URL" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $ANON_KEY" \
            -H "x-cron-secret: $CRON_TOKEN" \
            -d '{}')

          echo "HTTP $status"
          cat response.json
          echo

          if [ "$status" != "200" ]; then
            echo "::error::sync-worker returned HTTP $status"
            exit 1
          fi

          # Surface results in the Actions summary
          python3 - <<'PY'
          import json, sys
          with open("response.json") as fh:
              body = json.load(fh)
          if body.get("error"):
              print(f"::error::function reported: {body['error']}")
              sys.exit(1)
          processed = body.get("processed", [])
          failed = body.get("failed", [])
          print(f"::notice::processed {len(processed)}, failed {len(failed)}")
          if body.get("message") == "No items to process":
              print("Queue empty — nothing to do.")
          for f in failed[:10]:
              print(f"::warning::{f.get('id')}: {f.get('error')}")
          PY
