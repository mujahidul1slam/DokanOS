## CI guardrail — typecheck, unit tests, mocked browser tests
##
## WHY THIS EXISTS
## PR checks were Vercel-only. typecheck and test existed in package.json, were
## green and fast, and ran nowhere. A repo with no guardrail is itself a finding:
## this workflow would have flagged 2435c1b's breakage at the commit that caused
## it, not at merge time, by hand.
##
## The mocked Playwright suite (test:browser) runs against the real Vite app
## with intercepted Supabase API calls. It does NOT require Docker, a local
## database, or edge functions — only Node and a Chromium install.
##
## Real-stack smoke tests (test:smoke) are opt-in via the SMOKE environment
## variable because they need a running Supabase stack + Mailpit.

name: CI

on:
  push:
    branches: [main, Frontpage, "integration/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main, Frontpage]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Typecheck + Test + Browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        ## No --with-deps: the ubuntu-24.04 image already ships every runtime
        ## library Chromium needs (libnss3, libgbm1, libasound2t64, libatk*,
        ## libx*). --with-deps adds an apt-get install for 9 font packages only,
        ## and that apt call cannot resolve azure.archive.ubuntu.com from these
        ## runners. It failed identically on four attempts and made the gate
        ## unrunnable. The suite has no screenshot assertions, so fonts are not
        ## needed.
        run: npx playwright install chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Mocked browser tests (Playwright/mocked API)
        run: npm run test:browser
        env:
          PLAYWRIGHT_CHANNEL: ""

  sql:
    ## Rollback-only rehearsal of the WooCommerce SQL regression battery.
    ##
    ## WHY THIS EXISTS
    ## supabase/tests/woocommerce_*_test.sql are the only tests that exercise the
    ## real PostgreSQL schema — triggers, RPCs, RLS and idempotency asserted
    ## against a database built by the actual migrations, not mocks. Every file
    ## owns its own BEGIN; ... ROLLBACK; block, so a run proves the migrations
    ## apply and the RPCs behave while leaving nothing behind.
    ##
    ## They ran nowhere before this job. `npm run test:local:woocommerce-sql` is
    ## local-only and refuses any non-local host, so nothing caught a migration
    ## that stopped applying or a trigger that stopped firing until someone
    ## remembered to run it by hand. A fresh `supabase db reset` puts every
    ## migration in the local ledger, so the runner's --with-pending flag is
    ## never needed here.
    ##
    ## No secrets: the whole job talks to the throwaway local Docker stack.
    name: Migration rehearsal + SQL regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Rehearse every migration from scratch
        run: supabase db reset

      - name: WooCommerce SQL regression tests
        run: npm run test:local:woocommerce-sql

      - name: Stop stack
        if: always()
        run: supabase stop

  smoke:
    ## Opt-in: set repository variable SMOKE=true or dispatch manually.
    ## Requires a Supabase stack, so it runs only when explicitly requested.
    name: Real-stack smoke (opt-in)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.SMOKE == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations
        run: supabase db reset

      - name: Run smoke journey
        run: npm run test:smoke
        env:
          SMOKE_SUPABASE_URL: http://127.0.0.1:54321
          VERIFY_APP_URL: http://127.0.0.1:5173

      - name: Stop stack
        if: always()
        run: supabase stop
