# WooCommerce sends its own HMAC signature; Supabase JWT auth is not applicable.
[functions.woocommerce-webhook]
verify_jwt = false

[functions.woocommerce-worker]
verify_jwt = false

[functions.woocommerce-reconcile]
verify_jwt = false

[functions.woocommerce-admin]
verify_jwt = true

# Cutover is an operator action and requires a Supabase access token; it only
# reads WooCommerce and writes local evidence/work.
[functions.woocommerce-cutover]
verify_jwt = true

[functions.purge-unconfirmed]
verify_jwt = false

[functions.team-manage]
verify_jwt = true

# Local email verification: send real confirmation emails (captured by Mailpit
# at http://127.0.0.1:54324) instead of auto-confirming signups at creation.
# Revert by removing this section to return to the auto-confirm dev default.
[auth.email]
enable_confirmations = true

# Auth redirect allow-list. GoTrue replaces an unlisted `emailRedirectTo` with
# SITE_URL silently — with the defaults that dead-ended every confirmation link
# at http://127.0.0.1:3000 (verified live 2026-11-01). Site URL + every local
# app origin must be listed or the verify->app handoff cannot work.
[auth]
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080/**", "http://127.0.0.1:8080/**", "http://localhost:4175/**", "http://127.0.0.1:4175/**"]

